<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telão · BACC Academy</title>
<meta name="description" content="Slides em loop do BACC Academy para a TV da sala.">
<meta name="theme-color" content="#060D1C">
<style>
  :root{
    --navy:#0A1730; --navy2:#0C1E3E; --deep:#060D1C;
    --paper:#F6F4EE; --ink:#0B1B34;
    --gold:#C9A24B; --gold-l:#E6C579; --gold-d:#A9853A;
    --soft:#C9D5EA; --muted:#9DB0D2; --muted-c:#6A7896;
    --verde:#1EA54B; --vermelho:#D71D32; --amarelo:#F2A900;
    --serif:"Iowan Old Style",Georgia,"Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; overflow:hidden;}
  body{background:var(--deep); color:#fff; font-family:var(--sans); -webkit-font-smoothing:antialiased; cursor:none;}

  /* o fundo troca de cor conforme a cartela */
  .fundo{position:fixed; inset:0; z-index:0; background:var(--deep); transition:background 1.1s ease;}
  .fundo.claro{background:var(--paper);}
  .fundo::after{
    content:""; position:absolute; inset:0; opacity:1; transition:opacity 1.1s ease;
    background:radial-gradient(1200px 800px at 50% 35%, rgba(18,41,74,.55), rgba(6,13,28,.92));
  }
  .fundo.claro::after{opacity:0;}

  /* faixa nas cores da bandeira, no topo e na base */
  .faixa{position:fixed; left:0; right:0; height:.55vh; z-index:6;
         background:linear-gradient(90deg,var(--verde) 0 25%,var(--amarelo) 25% 50%,var(--vermelho) 50% 75%,var(--navy) 75% 100%);}
  .faixa.topo{top:0;} .faixa.base{bottom:0;}

  .relogio{position:fixed; z-index:5; right:3.2vw; top:3.4vh; text-align:right; font-variant-numeric:tabular-nums; transition:color .8s, opacity .6s;}
  /* na agenda o relogio sai, para a lista poder ocupar a tela toda */
  body.semRelogio .relogio{opacity:0;}
  .relogio .hora{font-size:clamp(20px,2.1vw,50px); font-weight:300; line-height:1;}
  .relogio .dia{font-size:clamp(10px,.9vw,20px); letter-spacing:.26em; color:var(--gold); font-weight:700; margin-top:.7vh;}
  body.claro .relogio{color:var(--ink);}

  .palco{position:fixed; inset:0; z-index:3; display:grid; place-items:center; padding:0 2vw;}
  .cartela{
    position:absolute; text-align:center; max-width:90vw; visibility:hidden;
    opacity:0; transform:translateY(2vh);
    transition:opacity .55s ease, transform .55s ease, visibility 0s linear .55s;
  }
  .cartela.on{
    opacity:1; transform:none; visibility:visible;
    transition:opacity .7s cubic-bezier(.16,.8,.3,1) .55s,
               transform .7s cubic-bezier(.16,.8,.3,1) .55s, visibility 0s linear .55s;
  }

  .marcaGrande{height:clamp(120px,34vh,520px); width:auto; display:block; margin:0 auto clamp(24px,4.5vh,70px);}
  .eyebrow{font-size:clamp(12px,1.2vw,28px); font-weight:700; letter-spacing:.34em; text-indent:.34em;
           text-transform:uppercase; color:var(--gold); margin-bottom:2.6vh;}
  .grande{font-size:clamp(1.9rem,5.6vw,8rem); font-weight:700; letter-spacing:-.03em; line-height:1.05;
          text-wrap:balance; max-width:19ch; margin:0 auto;}
  .media{font-size:clamp(1.4rem,3.8vw,5.4rem); font-weight:700; letter-spacing:-.025em; line-height:1.14;
         text-wrap:balance; max-width:24ch; margin:0 auto;}
  .serifa{font-family:var(--serif); font-style:italic; font-weight:400;}
  .apoio{font-size:clamp(.95rem,1.5vw,2.1rem); color:var(--soft); margin:3vh auto 0; line-height:1.5;
         max-width:40ch; text-wrap:pretty;}
  body.claro .grande, body.claro .media{color:var(--ink);}
  body.claro .apoio{color:var(--muted-c);}
  body.claro .eyebrow{color:var(--gold-d);}

  /* ---------- AGENDA ---------- */
  /* os tamanhos usam min(vw,vh) para a lista nunca estourar a altura da TV */
  .agenda{width:min(1680px,100%); margin:0 auto;}
  .agenda .lin{
    display:flex; align-items:center; gap:clamp(14px,2vw,50px);
    padding:clamp(5px,1.05vh,17px) clamp(10px,1.2vw,24px);
    border-bottom:1px solid rgba(255,255,255,.14); text-align:left;
  }
  .agenda .lin:last-child{border-bottom:none;}
  .agenda .dt{
    flex:none; width:clamp(110px,13vw,290px); font-weight:800;
    font-size:clamp(1.05rem,min(2.9vw,4.6vh),4rem); letter-spacing:-.025em; color:var(--gold-l);
    font-variant-numeric:tabular-nums; line-height:1.18;
  }
  .agenda .ev{
    flex:1; min-width:0; font-weight:700; letter-spacing:-.025em; line-height:1.18;
    font-size:clamp(1.05rem,min(3.4vw,5.4vh),4.8rem);
  }
  .agenda .tag{
    flex:none; font-size:clamp(.62rem,min(1.05vw,1.7vh),1.5rem); letter-spacing:.14em;
    text-transform:uppercase; white-space:nowrap;
    color:var(--gold-l); border:1px solid rgba(201,162,75,.45); border-radius:999px;
    padding:.55vh 1.1vw; font-weight:700;
  }
  /* a agenda pede mais largura que as cartelas de frase */
  .cartela.larga{max-width:96vw; width:96vw;}
  .cartela.larga .eyebrow{font-size:clamp(13px,min(1.45vw,2.3vh),34px); margin-bottom:2.2vh;}

  .barra{position:fixed; left:0; bottom:.55vh; height:.45vh; background:rgba(255,255,255,.14); width:100%; z-index:5;}
  .barra i{display:block; height:100%; background:linear-gradient(90deg,var(--gold),var(--gold-l)); width:0;}
  body.claro .barra{background:rgba(11,27,52,.12);}

  .ctrl{position:fixed; z-index:20; left:50%; bottom:3.4vh; transform:translateX(-50%);
        display:flex; gap:8px; align-items:center; padding:8px;
        background:rgba(10,23,48,.92); border:1px solid rgba(255,255,255,.16); border-radius:999px;
        backdrop-filter:blur(12px); transition:opacity .4s;}
  .ctrl.sumiu{opacity:0; pointer-events:none;}
  .ctrl button{background:none; border:none; color:#C3CCDD; font-size:13px; font-weight:700;
               padding:9px 15px; border-radius:999px; cursor:pointer; letter-spacing:.04em;}
  .ctrl button:hover{background:rgba(255,255,255,.1); color:#fff;}
  .ctrl .destaque{background:var(--gold); color:#0A1730;}
  .ctrl .conta{font-size:12px; color:#8FA0BC; padding:0 10px; font-variant-numeric:tabular-nums;}

  @media (prefers-reduced-motion:reduce){ .cartela{transition:opacity .3s;} }
</style>
</head>
<body>

  <div class="fundo" id="fundo"></div>
  <div class="faixa topo"></div>
  <div class="faixa base"></div>

  <div class="relogio"><div class="hora" id="hora">--:--</div><div class="dia" id="dia"></div></div>

  <div class="palco" id="palco"></div>
  <div class="barra"><i id="barra"></i></div>

  <div class="ctrl" id="ctrl">
    <button id="voltar">Anterior</button>
    <button class="destaque" id="pausar">Pausar</button>
    <button id="seguir">Próxima</button>
    <span class="conta" id="conta"></span>
    <button id="cheia">Tela cheia</button>
  </div>

<script>
(function(){
  'use strict';

  /* ===================================================================
     AS CARTELAS. Para editar, mexa so aqui.
     claro:true  -> fundo claro, para logo com texto escuro
     tipo:'agenda' -> monta a lista de eventos
     =================================================================== */
  var CARTELAS = [
    { claro:true, logo:'../media/deck/bacc_academy_logo.png',
      classe:'media', linha:'Bem-vindos ao começo de algo maior.' },

    { classe:'media serifa', linha:'Ninguém constrói sozinho. Por isso a gente começa junto.' },

    { logo:'../media/deck/bacc_white.png', eyebrow:'Uma iniciativa da',
      classe:'media', linha:'Brazilian-American Chamber of Commerce Southeast' },

    { classe:'media', linha:'Há 30 anos aproximando Brasil e Estados Unidos' },

    { tipo:'agenda' },

    { classe:'media serifa', linha:'Todo negócio grande começou com alguém que decidiu aprender.' }
  ];

  var AGENDA = [
    { dt:'14 Ago', ev:'BACC Academy' },
    { dt:'27 Ago', ev:'BACCstage', tag:'On-line' },
    { dt:'11 Set', ev:'BACC Academy' },
    { dt:'19 Set', ev:'Entre Cafés' },
    { dt:'30 Set', ev:'BACCstage', tag:'Presencial' },
    { dt:'09 Out', ev:'BACC Academy' },
    { dt:'29 Out', ev:'BACCstage', tag:'On-line' },
    { dt:'08 Dez', ev:'BACCstage', tag:'Confraternização' },
    { dt:'Fev 2027', ev:'Brazil Economic Outlook', tag:'Anual' }
  ];

  var SEGUNDOS = 7;

  var palco = document.getElementById('palco');
  var fundo = document.getElementById('fundo');
  var barra = document.getElementById('barra');
  var conta = document.getElementById('conta');
  var atual = -1, pausado = false, inicio = 0;

  function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

  function montar(c){
    var d = document.createElement('div');
    d.className = 'cartela';

    if (c.tipo === 'agenda'){
      d.className = 'cartela larga';
      d.innerHTML =
        '<div class="eyebrow">Agenda BACC-SE</div>' +
        '<div class="agenda">' +
          AGENDA.map(function(a){
            return '<div class="lin"><div class="dt">' + esc(a.dt) + '</div>' +
                   '<div class="ev">' + esc(a.ev) + '</div>' +
                   (a.tag ? '<div class="tag">' + esc(a.tag) + '</div>' : '') + '</div>';
          }).join('') +
        '</div>';
      return d;
    }

    d.innerHTML =
      (c.logo ? '<img class="marcaGrande" src="' + c.logo + '" alt="">' : '') +
      (c.eyebrow ? '<div class="eyebrow">' + esc(c.eyebrow) + '</div>' : '') +
      '<div class="' + (c.classe || 'media') + '">' + esc(c.linha) + '</div>' +
      (c.apoio ? '<div class="apoio">' + esc(c.apoio) + '</div>' : '');
    return d;
  }

  var nos = CARTELAS.map(function(c){ var n = montar(c); palco.appendChild(n); return n; });

  function mostrar(i){
    if (atual >= 0) nos[atual].classList.remove('on');
    atual = (i + nos.length) % nos.length;
    nos[atual].classList.add('on');

    var claro = !!CARTELAS[atual].claro;
    fundo.classList.toggle('claro', claro);
    document.body.classList.toggle('claro', claro);
    document.body.classList.toggle('semRelogio', CARTELAS[atual].tipo === 'agenda');

    conta.textContent = (atual + 1) + '/' + nos.length;
    inicio = performance.now();
  }

  function passo(agora){
    if (!pausado){
      var p = Math.min(1, (agora - inicio) / (SEGUNDOS * 1000));
      barra.style.width = (p * 100) + '%';
      if (p >= 1) mostrar(atual + 1);
    }
    requestAnimationFrame(passo);
  }

  /* relogio preso no fuso de Atlanta, com AM e PM */
  function relogio(){
    var d = new Date(), h, dia;
    try {
      h = d.toLocaleTimeString('en-US', { timeZone:'America/New_York', hour:'numeric', minute:'2-digit', hour12:true });
      dia = d.toLocaleDateString('pt-BR', { timeZone:'America/New_York', day:'2-digit', month:'long' }).toUpperCase();
    } catch(e){
      h = ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2);
      dia = ('0'+d.getDate()).slice(-2);
    }
    document.getElementById('hora').textContent = h;
    document.getElementById('dia').textContent = dia;
  }
  relogio(); setInterval(relogio, 20000);

  document.getElementById('seguir').onclick = function(){ mostrar(atual + 1); };
  document.getElementById('voltar').onclick = function(){ mostrar(atual - 1); };
  document.getElementById('pausar').onclick = function(){
    pausado = !pausado;
    this.textContent = pausado ? 'Continuar' : 'Pausar';
    if (!pausado) inicio = performance.now();
  };
  document.getElementById('cheia').onclick = function(){
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen();
  };
  document.addEventListener('keydown', function(e){
    if (e.key === 'ArrowRight') mostrar(atual + 1);
    if (e.key === 'ArrowLeft')  mostrar(atual - 1);
    if (e.key === ' ') { e.preventDefault(); document.getElementById('pausar').click(); }
    if (e.key.toLowerCase() === 'f') document.getElementById('cheia').click();
  });

  var ctrl = document.getElementById('ctrl'), some = null;
  function acordar(){
    ctrl.classList.remove('sumiu');
    document.body.style.cursor = 'default';
    clearTimeout(some);
    some = setTimeout(function(){ ctrl.classList.add('sumiu'); document.body.style.cursor = 'none'; }, 3500);
  }
  document.addEventListener('mousemove', acordar);
  acordar();

  mostrar(0);
  requestAnimationFrame(passo);
})();
</script>
</body>
</html>
